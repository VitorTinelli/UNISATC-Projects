<!-- EX: 14
O desenvolvedor júnior Pedro Paranhos, ao iniciar seu primeiro job na empresa de softwares MasterRace Inc, se depara com uma task básica envolvendo a criação do front-end de uma tela de login para uma nova aplicação WEB que um cliente da MasterRace solicitou. 

Seu gerente de produto especificou que a tela é bem básica e neste momento aplicação não precisa de JavaScript, apenas HTML e CSS. A tela deve conter um título, uma frase explicativa, dois campos com labels (e-mail e senha) e um botão para ação de Login.

Os poucos requisitos técnicos foram que os campos tivessem o tipo correto para cada função/uso, e que ambos os campos fossem marcados como requiridos/obrigatórios para que o usuário não possa avançar no login sem preencher os mesmos.

Como referencia visual lhe foi entregue a imagem abaixo:

Diante destas informações, se você fosse Pedro Paranhos, como finalizaria essa tarefa?

No campo abaixo insera um link on-line com a sua solução para este exercício, contendo o código necessário de HTML e CSS. Questões envolvendo design, cores, tamanhos e outros elementos estão 100% livres para sua escolha.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div class="tudo">
        <header>
            <h1>AREA RESTRITA</h1>
            <h3>Informe suas credenciais abaixo para prosseguir</h2>
        </header>
        <main>
            <form>
                <div>
                    <label for="email">Seu email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="senha">Sua senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <div class="botao">
                    <button type="submit">Login</button>
                </div>
            </form>
        </main>
    </div>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
        }

        .tudo {
            background-color: #fff;
            border-radius: 5px;
            max-width: 720px;
            padding: 20px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .botao{
            text-align: center;
            margin-top: 20px;
        }

        header {
            text-align: center;
        }

        form {
            max-width: 300px;
            margin: auto;
            padding: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 30px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</body>
</html>
